<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>WA Multi</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm5.2 14.2c-.2.6-1.2 1.2-1.7 1.2-.4.1-1 .1-1.6-.1-2.6-.8-4.3-2.6-5.6-4.8-.5-.9-.9-2-.7-2.9.1-.6.6-1.5 1.2-1.7.3-.1.8-.1 1 .1.2.2.9 1.6.9 1.8.1.2 0 .4-.1.6l-.5.7c-.2.2-.2.4-.1.6.5.9 1.5 1.9 2.5 2.4.2.1.4.1.6-.1l.7-.7c.2-.2.4-.2.6-.1.2.1 1.6.8 1.8.9.2.3.2.7 0 1.1Z" fill="currentColor"/></svg>
      <span>WA Multi</span>
    </div>

    <div class="acc-switch" id="accSwitch">
      <button id="accBtn" class="acc-btn" title="Ganti akun">
        <span class="acc-dot" id="accDot"></span>
        <span id="accName">Pilih akun</span>
        <svg width="12" height="12" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div id="accMenu" class="acc-menu hidden"></div>
    </div>

    <div class="spacer"></div>

    <button id="themeBtn" class="icon-btn" title="Mode gelap/terang">
      <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="2"/></svg>
      <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" class="hidden"><circle cx="12" cy="12" r="4.4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="stage">
    <div id="welcome" class="welcome">
      <div class="welcome-card">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm5.2 14.2c-.2.6-1.2 1.2-1.7 1.2-.4.1-1 .1-1.6-.1-2.6-.8-4.3-2.6-5.6-4.8-.5-.9-.9-2-.7-2.9.1-.6.6-1.5 1.2-1.7.3-.1.8-.1 1 .1.2.2.9 1.6.9 1.8.1.2 0 .4-.1.6l-.5.7c-.2.2-.2.4-.1.6.5.9 1.5 1.9 2.5 2.4.2.1.4.1.6-.1l.7-.7c.2-.2.4-.2.6-.1.2.1 1.6.8 1.8.9.2.3.2.7 0 1.1Z" fill="currentColor"/></svg>
        <h2>Selamat datang di WA Multi</h2>
        <p>Buka akun dari dropdown di atas, atau tambah akun baru.<br/>Setiap akun login sekali — abis itu selalu tersimpan.</p>
        <button id="welcomeAdd" class="primary-btn">+ Tambah akun pertama</button>
      </div>
    </div>
  </main>

  <dialog id="renameDlg">
    <form method="dialog">
      <h3>Ganti nama akun</h3>
      <input id="renameInput" type="text" placeholder="Nama baru" maxlength="30" required />
      <div class="row">
        <button type="button" class="ghost-btn" id="renameCancel">Batal</button>
        <button type="submit" class="primary-btn">Simpan</button>
      </div>
    </form>
  </dialog>

  <dialog id="addDlg">
    <form method="dialog">
      <h3>Tambah akun</h3>
      <input id="newName" type="text" placeholder="Nama akun (mis. Sweety 1)" maxlength="30" required />
      <p class="hint">Nanti lu scan QR sekali buat akun ini.</p>
      <div class="row">
        <button type="button" class="ghost-btn" id="addCancel">Batal</button>
        <button type="submit" class="primary-btn" id="addSave">Simpan</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
